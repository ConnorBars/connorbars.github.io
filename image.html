<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>image filtering</title>
    <style>
        img {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <img id="duck" src="Anser_anser_1_(Piotr_Kuczynski).jpg">
    <canvas id="canvas" width="300" height="300"></canvas>
</body>
</html>

<script>
    var array2D = []
    window.addEventListener("load", main);

    function main() {
        var canvas = document.getElementById("canvas")
        var ctx = canvas.getContext("2d")

        var duck = document.getElementById("duck")
        ctx.drawImage(duck, 0, 0, 300, 300)

        var imageData = ctx.getImageData(0, 0, 300, 300)
        console.log(imageData)
 
        for (i=0; i < imageData.data.length; i = i + 4)  {
            imageData.data[i]=imageData.data[i]+100
        } 
        for (i=2; i < imageData.data.length; i = i + 4)  {
            imageData.data[i]=imageData.data[i]-100
            }
        for (i=0; i < 300; i++){
            array2D.push([])
            for (j=0; j < 1200; j++) {
                array2D[i][j]=imageData.data[]
            }
        }
        ctx.putImageData(imageData,0,0)
    }

</script>
